<style>
  :root { --navy:#0b2545; --teal:#13315c; --accent:#1f7a8c; --light:#eef4f8; --border:#d0dbe5; --good:#1e8e3e; --warn:#e37400; --bad:#c5221f; --grey:#5f6368; }
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; font-size: 13px; color: #202124; margin: 0; padding: 12px; background: #fff; }
  h2 { font-size: 15px; color: var(--navy); margin: 14px 0 8px; }
  h3 { font-size: 13px; color: var(--teal); margin: 12px 0 6px; }
  label { display: block; font-weight: bold; margin: 9px 0 3px; color: #3c4043; font-size: 12px; }
  .hint { font-weight: normal; color: var(--grey); font-size: 11px; }
  input[type=text], input[type=number], input[type=date], input[type=time], input[type=email], select, textarea {
    width: 100%; padding: 7px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit; background: #fff; }
  textarea { resize: vertical; }
  textarea.code { font-family: Consolas, "Courier New", monospace; font-size: 12px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 7px 12px; font-size: 12px; cursor: pointer; margin: 2px 2px 2px 0; }
  button.secondary { background: #fff; color: var(--teal); border: 1px solid var(--border); }
  button.danger { background: var(--bad); }
  button.warn { background: var(--warn); }
  button.good { background: var(--good); }
  button:disabled { opacity: .55; cursor: default; }
  .tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--light); margin: -4px 0 10px; flex-wrap: wrap; }
  .tab { padding: 7px 9px; cursor: pointer; color: var(--grey); font-weight: bold; border-bottom: 2px solid transparent; margin-bottom: -2px; font-size: 12px; }
  .tab.active { color: var(--navy); border-color: var(--accent); }
  .pane { display: none; } .pane.active { display: block; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .tile { background: var(--light); border-radius: 8px; padding: 8px; }
  .tile .v { font-size: 20px; font-weight: bold; color: var(--navy); }
  .tile .l { font-size: 11px; color: var(--grey); }
  .card { border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
  .row { display: flex; gap: 6px; } .row > * { flex: 1; }
  .badge { display: inline-block; padding: 2px 7px; border-radius: 10px; font-size: 11px; font-weight: bold; }
  .b-Active { background: #e6f4ea; color: var(--good); } .b-Scheduled { background: #e8f0fe; color: #1a73e8; }
  .b-Paused { background: #fef7e0; color: var(--warn); } .b-Stopped { background: #fce8e6; color: var(--bad); }
  .b-Completed { background: #f1f3f4; color: var(--grey); } .b-Draft { background: #fff; color: var(--grey); border: 1px solid var(--border); }
  .progress { height: 8px; background: #e8eaed; border-radius: 4px; overflow: hidden; margin: 6px 0; }
  .progress > div { height: 100%; background: var(--accent); }
  .small { font-size: 11px; color: var(--grey); }
  .msg { padding: 8px 10px; border-radius: 6px; margin: 8px 0; display: none; white-space: pre-wrap; }
  .msg.ok { display: block; background: #e6f4ea; color: #0d652d; }
  .msg.err { display: block; background: #fce8e6; color: #a50e0e; }
  .msg.info { display: block; background: #e8f0fe; color: #174ea6; }
  .alert { background: #fef7e0; color: #8a4b00; padding: 8px; border-radius: 6px; margin: 6px 0; font-size: 12px; }
  .alert.bad { background: #fce8e6; color: #a50e0e; }
  .days label { display: inline-block; font-weight: normal; margin: 2px 6px 2px 0; }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #ccc; border-top-color: var(--accent); border-radius: 50%; animation: s .8s linear infinite; vertical-align: middle; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
